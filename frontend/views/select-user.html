<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>اختار اسمك للمتابعة - مدارس الأحد</title>
    <link rel="stylesheet" href="/public/css/global.css">
    <link rel="stylesheet" href="/public/css/select-user.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div class="mobile-wrapper select-wrapper">
        <header class="select-header">
            <div class="mini-logo-container">
                <svg viewBox="0 0 120 100" class="church-logo-sm" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M60 82 C44 75 25 76 12 82 L12 36 C25 30 44 29 60 36 C76 29 95 30 108 36 L108 82 C95 76 76 75 60 82 Z" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round"/>
                    <path d="M60 37 L60 82" stroke="#FFFFFF" stroke-width="3"/>
                    <path d="M19 43 C30 38 46 38 56 43" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
                    <path d="M64 43 C74 38 90 38 101 43" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
                    <path d="M35 50 V68 M29 56 H41" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
                    <path d="M60 14 V58" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
                    <path d="M46 29 H74" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
                </svg>
            </div>
            <h1 class="choose-title">اختار اسمك للمتابعة</h1>
        </header>

        <main class="cards-group">
            <button class="user-row-card" onclick="handleUserSelection('مارلين نزيه')">
                <div class="avatar-circle">
                    <svg viewBox="0 0 40 40" class="original-avatar-svg">
                        <circle cx="20" cy="14" r="7" fill="#FFFFFF"/>
                        <path d="M8 34 C8 26 13 23 20 23 C27 23 32 26 32 34 Z" fill="#FFFFFF"/>
                    </svg>
                </div>
                <span class="servant-label">مارلين نزيه</span>
                <span class="arrow-circle">
                    <i class="fa-solid fa-chevron-left"></i>
                </span>
            </button>

            <button class="user-row-card" onclick="handleUserSelection('مريم باشا')">
                <div class="avatar-circle">
                    <svg viewBox="0 0 40 40" class="original-avatar-svg">
                        <circle cx="20" cy="14" r="7" fill="#FFFFFF"/>
                        <path d="M8 34 C8 26 13 23 20 23 C27 23 32 26 32 34 Z" fill="#FFFFFF"/>
                    </svg>
                </div>
                <span class="servant-label">مريم باشا</span>
                <span class="arrow-circle">
                    <i class="fa-solid fa-chevron-left"></i>
                </span>
            </button>

            <button class="user-row-card" onclick="handleUserSelection('بولس دميان')">
                <div class="avatar-circle">
                    <svg viewBox="0 0 40 40" class="original-avatar-svg">
                        <circle cx="20" cy="14" r="7" fill="#FFFFFF"/>
                        <path d="M8 34 C8 26 13 23 20 23 C27 23 32 26 32 34 Z" fill="#FFFFFF"/>
                    </svg>
                </div>
                <span class="servant-label">بولس دميان</span>
                <span class="arrow-circle">
                    <i class="fa-solid fa-chevron-left"></i>
                </span>
            </button>
        </main>

        <div class="divider-line">
            <span>لوحات المتابعة العامة</span>
        </div>

        <footer class="bottom-board-group">
            <button class="board-card" onclick="openHonorBoard()">
                <div class="board-icon star-gold">
                    <i class="fa-solid fa-star"></i>
                </div>
                <div class="board-info">
                    <h4>لوحة الشرف</h4>
                    <p>ترتيب الأطفال الأكثر تميزاً والتزاماً</p>
                </div>
                <span class="board-arrow">
                    <i class="fa-solid fa-chevron-left"></i>
                </span>
            </button>

            <button class="board-card" onclick="openAllKidsStats()">
                <div class="board-icon pie-blue">
                    <i class="fa-solid fa-chart-pie"></i>
                </div>
                <div class="board-info">
                    <h4>إحصائية جميع الأطفال</h4>
                    <p>سجل الحضور والبيانات العامة</p>
                </div>
                <span class="board-arrow">
                    <i class="fa-solid fa-chevron-left"></i>
                </span>
            </button>
        </footer>
    </div>

    <!-- نافذة منبثقة لحماية حساب الخادم (إنشاء أو إدخال كلمة المرور) -->
    <div class="auth-modal-overlay" id="authModal" style="display: none;">
        <div class="auth-modal-card">
            <h3 id="modalTitle">تسجيل الدخول</h3>
            <p id="modalDesc">يرجى إدخال كلمة المرور الخاصة بك للمتابعة</p>

            <form id="authForm" onsubmit="handleAuthSubmit(event)">
                <div class="modal-input-group">
                    <input type="password" id="modalPasswordInput" placeholder="أدخل كلمة المرور" required autocomplete="off">
                </div>

                <div class="modal-input-group" id="confirmPasswordGroup" style="display: none;">
                    <input type="password" id="modalConfirmPasswordInput" placeholder="تأكيد كلمة المرور" autocomplete="off">
                </div>

                <div class="modal-error-msg" id="modalError" style="display: none;"></div>

                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeAuthModal()">إلغاء</button>
                    <button type="submit" class="btn-confirm" id="modalSubmitBtn">تأكيد</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/src/js/select-user.js"></script>
</body>
</html>
