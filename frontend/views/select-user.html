<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مدارس الأحد</title>

    <!-- الأيقونة والمانيفست -->
    <link rel="manifest" href="/public/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/public/icon.svg">
    <link rel="apple-touch-icon" href="/public/icon.svg">

    <!-- التنسيقات -->
    <link rel="stylesheet" href="/public/css/global.css">
    <link rel="stylesheet" href="/public/css/select-user.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div class="mobile-wrapper select-wrapper">
        <div class="bg-decorations">
            <i class="fa-solid fa-star doodle d-1"></i>
            <i class="fa-solid fa-dove doodle d-2"></i>
            <i class="fa-solid fa-cross doodle d-3"></i>
            <i class="fa-solid fa-heart doodle d-4"></i>
        </div>

        <header class="select-header">
            <div class="mini-logo-container">
                <svg viewBox="0 0 120 100" class="church-logo-sm" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M60 82 C44 75 25 76 12 82 L12 36 C25 30 44 29 60 36 C76 29 95 30 108 36 L108 82 C95 76 76 75 60 82 Z" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round"/>
                    <path d="M60 37 L60 82" stroke="#FFFFFF" stroke-width="3"/>
                    <path d="M19 43 C30 38 46 38 56 43" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
                    <path d="M64 43 C74 38 90 38 101 43" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
                    <path d="M35 50 V68 M29 56 H41" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
                    <path d="M60 14 V58" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
                    <path d="M46 29 H74" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
                    <path d="M84 19 L87 9 L90 19 L100 22 L90 25 L87 35 L84 25 L74 22 Z" fill="#FFFFFF"/>
                </svg>
            </div>
            <h2 class="choose-title">اختار اسمك للمتابعة</h2>
        </header>

        <main class="cards-group">
            <button class="user-row-card" onclick="handleUserSelection('مارلين نزيه')">
                <div class="avatar-circle">
                    <i class="fa-solid fa-user" style="color: #ffffff; font-size: 18px;"></i>
                </div>
                <span class="servant-label">مارلين نزيه</span>
                <div class="arrow-circle">
                    <i class="fa-solid fa-chevron-left"></i>
                </div>
            </button>

            <button class="user-row-card" onclick="handleUserSelection('مريم باشا')">
                <div class="avatar-circle">
                    <i class="fa-solid fa-user" style="color: #ffffff; font-size: 18px;"></i>
                </div>
                <span class="servant-label">مريم باشا</span>
                <div class="arrow-circle">
                    <i class="fa-solid fa-chevron-left"></i>
                </div>
            </button>

            <button class="user-row-card" onclick="handleUserSelection('بولس دميان')">
                <div class="avatar-circle">
                    <i class="fa-solid fa-user" style="color: #ffffff; font-size: 18px;"></i>
                </div>
                <span class="servant-label">بولس دميان</span>
                <div class="arrow-circle">
                    <i class="fa-solid fa-chevron-left"></i>
                </div>
            </button>
        </main>

        <div class="divider-line">
            <span>لوحات المتابعة العامة</span>
        </div>

        <section class="bottom-board-group">
            <!-- كارت أبطال سنة أولى ابتدائي بالاسم الجديد -->
            <div class="board-card" onclick="openHonorBoard()">
                <div class="board-icon">
                    <i class="fa-solid fa-star star-gold"></i>
                </div>
                <div class="board-info">
                    <h4>أبطال سنة أولى ابتدائي</h4>
                    <p>ترتيب الأطفال الأكثر تميزاً والتزاماً</p>
                </div>
                <div class="board-arrow">
                    <i class="fa-solid fa-chevron-left"></i>
                </div>
            </div>

            <div class="board-card" onclick="openAllKidsStats()">
                <div class="board-icon">
                    <i class="fa-solid fa-chart-pie pie-blue"></i>
                </div>
                <div class="board-info">
                    <h4>إحصائية جميع الأطفال</h4>
                    <p>سجل الحضور والبيانات العامة</p>
                </div>
                <div class="board-arrow">
                    <i class="fa-solid fa-chevron-left"></i>
                </div>
            </div>
        </section>

        <!-- نافذة التحقق من كلمة المرور -->
        <div id="authModal" class="auth-modal-overlay" style="display: none;">
            <div class="auth-modal-card">
                <h3 id="modalTitle">تسجيل الدخول</h3>
                <p id="modalDesc">أدخل كلمة المرور الخاصة بك</p>
                
                <form id="servantAuthForm" onsubmit="handleAuthSubmit(event)">
                    <div class="modal-input-group">
                        <input type="password" id="modalPasswordInput" required autocomplete="off">
                    </div>
                    
                    <div class="modal-input-group" id="confirmPasswordGroup" style="display: none;">
                        <input type="password" id="modalConfirmPasswordInput" autocomplete="off">
                    </div>

                    <div id="modalError" class="modal-error-msg" style="display: none;"></div>

                    <div class="modal-actions">
                        <button type="button" class="btn-cancel" onclick="closeAuthModal()">إلغاء</button>
                        <button type="submit" class="btn-confirm" id="modalSubmitBtn">دخول</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/src/js/select-user.js"></script>
</body>
</html>
